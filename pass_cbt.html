025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터 모델링의 이해","question":"다음 중 데이터베이스 정규화 과정에서 제2정규형(2NF)의 충족 조건으로 가장 올바른 것은?","code_snippet":null,"options":["모든 도메인이 원자값(Atomic Value)으로만 구성된다.","제1정규형을 만족하고, 기본키의 진부분집합이 일반 속성을 결정하지 않는 완전 함수 종속을 이룬다.","제2정규형을 만족하고, 기본키가 아닌 일반 속성 간의 이행적 함수 종속성이 제거된다.","결정자가 모두 후보키인 상태를 만족한다."],"answer":2,"accepted_answers":null,"explanation":"1NF는 원자성 확보, 2NF는 부분 함수 종속성 제거(완전 함수 종속), 3NF는 이행 함수 종속성 제거, BCNF는 결정자 후보키화입니다.","correct_answer":2,"subject_name":"1과목 데이터 모델링의 이해"},{"id":"sqld-003","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터 모델링의 이해","question":"엔터티의 특징 중 발생시점에 따라 분류할 때, 업무가 진행됨에 따라 지속적으로 발생하는 대량의 엔터티로 가장 적절한 것은?","code_snippet":null,"options":["기본 엔터티 (Fundamental Entity)","중심 엔터티 (Main Entity)","행위 엔터티 (Action Entity)","개념 엔터티 (Conceptual Entity)"],"answer":3,"accepted_answers":null,"explanation":"발생시점에 따른 분류: 1. 기본 엔터티(사원, 부서, 고객 등 원래 존재), 2. 중심 엔터티(주문, 매출, 접수 등 업무의 중심), 3. 행위 엔터티(주문목록, 배송이력 등 2개 이상의 부모 엔터티로부터 빈번히 발생)","correct_answer":3,"subject_name":"1과목 데이터 모델링의 이해"},{"id":"sqld-004","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터 모델링의 이해","question":"식별자(Identifier)의 분류 중, 엔터티 내에서 대표성을 가지며 다른 엔터티와 참조 관계를 형성할 수 있는 식별자는?","code_snippet":null,"options":["주식별자 (Primary Identifier)","보조식별자 (Alternate Identifier)","내부식별자 (Internal Identifier)","대리식별자 (Surrogate Identifier)"],"answer":1,"accepted_answers":null,"explanation":"주식별자는 엔터티를 대표하는 유일한 식별자로, 참조 무결성을 위해 외래키로 참조될 수 있습니다.","correct_answer":1,"subject_name":"1과목 데이터 모델링의 이해"},{"id":"sqld-005","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터 모델링의 이해","question":"성능 향상을 위한 반정규화(De-normalization) 기법 중, 빈번하게 발생하는 조인(Join) 연산의 부하를 줄이기 위해 사용하는 방법이 아닌 것은?","code_snippet":null,"options":["중복 컬럼 추가 (추가적인 조인 경로 단축)","파생 컬럼 추가 (총합, 평균 등 미리 계산된 칼럼 유지)","테이블의 수평 분할 (Partitioning)","제3정규형을 적용하여 이행적 함수 종속성 제거"],"answer":4,"accepted_answers":null,"explanation":"제3정규형 적용은 정규화(Normalization) 과정이며, 반정규화는 성능을 위해 정규화된 모델을 의도적으로 중복·통합·분할하는 작업입니다.","correct_answer":4,"subject_name":"1과목 데이터 모델링의 이해"},{"id":"sqld-006","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 EMP 테이블에서 수행된 SQL의 실행 결과 출력되는 행(Row)의 개수로 올바른 것은?","code_snippet":"SELECT DEPTNO, AVG(SAL) AS AVG_SAL\\nFROM EMP\\nGROUP BY DEPTNO\\nHAVING AVG(SAL) >= 3000\\nORDER BY AVG_SAL DESC;","options":["1개 행","2개 행","3개 행","5개 행"],"answer":2,"accepted_answers":null,"explanation":"부서별 평균 급여 계산 시 DEPTNO 10은 3500, DEPTNO 20은 2500, DEPTNO 30은 5000입니다. HAVING 조건 AVG(SAL) >= 3000에 의해 30번과 10번 부서 2개 행만 반환됩니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-007","year":2020,"session":"2020년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 SQL에서 NULL 값에 대한 설명으로 가장 옳지 않은 것은?","code_snippet":"SELECT COL1 + 10, COUNT(*), COUNT(COL1) FROM TBL;","options":["NULL과의 산술 연산 결과는 항상 NULL이다.","집계 함수(SUM, AVG 등)는 NULL 값을 0으로 자동 변환한 후 연산한다.","COUNT(*) 함수는 NULL을 포함한 전체 행 수를 반환한다.","WHERE COL1 = NULL 연산은 참을 반환하지 않으며, IS NULL을 사용해야 한다."],"answer":2,"accepted_answers":null,"explanation":"집계 함수는 NULL을 0으로 치환하지 않고 연산 대상에서 '완전히 제외(무시)'하고 나머지 행들로만 계산합니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-008","year":2026,"session":"2026년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 윈도우 함수 중 동일한 순위가 있을 경우 다음 순위를 건너뛰지 않고 연속된 순위를 부여하는 함수는?","code_snippet":"SELECT ENAME, SAL,\\n       [ 함수 ] OVER (ORDER BY SAL DESC) AS RNK\\nFROM EMP;","options":["RANK","DENSE_RANK","ROW_NUMBER","NTILE"],"answer":2,"accepted_answers":null,"explanation":"DENSE_RANK는 동순위가 발생해도 다음 순위를 건너뛰지 않고 1, 2, 2, 3 처럼 연속된 순위를 부여합니다. (RANK는 1, 2, 2, 4)","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-009","year":2025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 SQL 문장에서 사용된 집합 연산자 중 두 테이블의 결과 집합에서 공통으로 존재하는 교집합(Intersection)만을 반환하는 연산자는?","code_snippet":null,"options":["UNION","UNION ALL","INTERSECT","MINUS (또는 EXCEPT)"],"answer":3,"accepted_answers":null,"explanation":"INTERSECT는 두 쿼리의 공통된 결과(교집합)를 중복 제거 후 반환합니다. UNION은 합집합, MINUS는 차집합입니다.","correct_answer":3,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-010","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 다중 행 서브쿼리(Multi-Row Subquery) 연산자로 사용할 수 없는 것은?","code_snippet":null,"options":["IN","ANY (또는 SOME)","ALL","= (단일 등호)"],"answer":4,"accepted_answers":null,"explanation":"단일 등호(=)는 서브쿼리의 반환 결과가 반드시 1행이어야 하는 단일 행 비교 연산자입니다. 반환 행이 2개 이상이면 에러가 발생합니다.","correct_answer":4,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-011","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 그룹 함수(Group Function) 중 소계와 총계를 계층적으로 생성해주는 함수는?","code_snippet":"SELECT DEPTNO, JOB, SUM(SAL)\\nFROM EMP\\nGROUP BY ROLLUP(DEPTNO, JOB);","options":["ROLLUP","CUBE","GROUPING SETS","PIVOT"],"answer":1,"accepted_answers":null,"explanation":"ROLLUP은 인수로 전달된 컬럼의 오른쪽에서 왼쪽 방향으로 계층적인 소계와 총계를 산출합니다. CUBE는 가능한 모든 조합의 다차원 집계를 산출합니다.","correct_answer":1,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-012","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 SQL 중 조인(Join) 수행 시 조인 조건을 만족하지 않는 왼쪽 테이블의 모든 행도 함께 결과에 포함하는 조인 구문은?","code_snippet":null,"options":["INNER JOIN","LEFT OUTER JOIN","RIGHT OUTER JOIN","CROSS JOIN"],"answer":2,"accepted_answers":null,"explanation":"LEFT OUTER JOIN(왼쪽 외부 조인)은 왼쪽 테이블의 모든 행을 출력하며, 오른쪽 테이블과 일치하는 행이 없으면 오른쪽 컬럼 값은 NULL로 채워집니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-013","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 트랜잭션의 제어어(TCL)에 해당하지 않는 명령어는?","code_snippet":null,"options":["COMMIT","ROLLBACK","SAVEPOINT","GRANT"],"answer":4,"accepted_answers":null,"explanation":"GRANT와 REVOKE는 권한을 부여하고 회수하는 DCL(데이터 제어어)입니다. COMMIT, ROLLBACK, SAVEPOINT는 TCL입니다.","correct_answer":4,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-014","year":2020,"session":"2020년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 오라클(Oracle)에서 NULL 값을 다른 기본값으로 치환하기 위해 사용하는 내장 함수는?","code_snippet":null,"options":["NVL","ISNULL","IFNULL","NULLIF"],"answer":1,"accepted_answers":null,"explanation":"오라클에서는 NVL(컬럼, 대체값) 또는 표준 COALESCE를 사용합니다. ISNULL은 SQL Server, IFNULL은 MySQL 함수입니다.","correct_answer":1,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-015","year":2026,"session":"2026년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 SQL 문장 실행 시 최종적으로 적용되는 정렬 순서로 올바른 것은?","code_snippet":"SELECT ENAME, DEPTNO, SAL\\nFROM EMP\\nORDER BY DEPTNO ASC, SAL DESC;","options":["부서번호 내림차순 정렬 후 급여 오름차순","부서번호 오름차순 정렬 후 급여 내림차순","급여 내림차순 정렬 후 부서번호 오름차순","부서번호와 급여 모두 오름차순"],"answer":2,"accepted_answers":null,"explanation":"ORDER BY 절에 나열된 순서대로 정렬됩니다. 먼저 DEPTNO 기준 오름차순(ASC)으로 정렬되고, DEPTNO가 동일한 행들 내에서 SAL 기준 내림차순(DESC)으로 정렬됩니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-016","year":2025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"윈도우 함수 중 현재 행을 기준으로 이전 N번째 행의 값을 가져오는 함수는?","code_snippet":"SELECT ENAME, SAL,\\n       LAG(SAL, 1) OVER (ORDER BY HIREDATE) AS PREV_SAL\\nFROM EMP;","options":["LEAD","LAG","FIRST_VALUE","RATIO_TO_REPORT"],"answer":2,"accepted_answers":null,"explanation":"LAG는 이전 행의 값을 참조하며, LEAD는 이후(다음) 행의 값을 참조합니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-017","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 DDL(데이터 정의어) 명령어 중 테이블의 모든 행을 즉시 삭제하고 용량을 초기화하며, ROLLBACK이 불가능한 명령어는?","code_snippet":null,"options":["DELETE","TRUNCATE","DROP","ALTER"],"answer":2,"accepted_answers":null,"explanation":"TRUNCATE TABLE은 테이블 구조는 남겨두고 데이터 전체를 빠르게 삭제하며 로그를 최소화하여 ROLLBACK이 불가합니다. DELETE는 DML로 롤백이 가능합니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-018","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 계층형 질의(Hierarchical Query) 구문 중 루트 노드(최상위 계층)를 지정하기 위해 사용하는 키워드는?","code_snippet":"SELECT LEVEL, ENAME, MGR\\nFROM EMP\\nSTART WITH MGR IS NULL\\nCONNECT BY PRIOR EMPNO = MGR;","options":["START WITH","CONNECT BY","PRIOR","ORDER SIBLINGS BY"],"answer":1,"accepted_answers":null,"explanation":"계층형 질의에서 전개의 시작점(루트 노드)을 지정하는 키워드는 START WITH 절입니다.","correct_answer":1,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-019","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"서브쿼리가 반환하는 결과가 존재하는지 여부만을 확인하여 불필요한 전체 검색을 방지하는 연산자는?","code_snippet":null,"options":["IN","EXISTS","BETWEEN","LIKE"],"answer":2,"accepted_answers":null,"explanation":"EXISTS 연산자는 조건에 일치하는 행이 최소 1건이라도 발견되는 즉시 TRUE를 반환하고 검색을 중단하므로 대용량 데이터에서 성능이 매우 우수합니다.","correct_answer":2,"subject_name":"2과목 SQL 기본 및 활용"},{"id":"sqld-020","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 SQL 기본 및 활용","question":"다음 중 문자열 함수 중 문자열의 길이를 바이트(Byte) 단위가 아닌 글자 수 단위로 반환하는 표준 함수는?","code_snippet":null,"options":["LENGTH","LENGTHB","SUBSTRB","INSTRB"],"answer":1,"accepted_answers":null,"explanation":"LENGTH는 문자열의 순수 글자 수를 반환하며, LENGTHB는 저장 공간의 바이트(Byte) 길이를 반환합니다.","correct_answer":1,"subject_name":"2과목 SQL 기본 및 활용"}]`),wt=JSON.parse(`[{"id":"adsp-001","year":2026,"session":"2026년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터의 이해","question":"노나카 이쿠지로의 지식 변환 SECI 모형에서 '형식지(Explicit Knowledge)에서 새로운 형식지로의 체계적 결합'에 해당하는 단계는?","code_snippet":null,"options":["사회화 (Socialization)","표출화 (Externalization)","연결화 (Combination)","내면화 (Internalization)"],"answer":3,"accepted_answers":null,"explanation":"형식지 간의 결합, 편집, 체계화는 연결화(Combination)입니다. 사회화는 암묵지→암묵지, 표출화는 암묵지→형식지, 내면화는 형식지→암묵지입니다.","correct_answer":3,"subject_name":"1과목 데이터의 이해"},{"id":"adsp-002","year":2025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터의 이해","question":"DIKW(Data, Information, Knowledge, Wisdom) 피라미드 계층 구조에 대한 설명으로 가장 올바른 것은?","code_snippet":null,"options":["Data는 가공 및 맥락이 부여된 상태의 데이터이다.","Information은 데이터 간의 관계를 바탕으로 패턴을 이해한 지적 자산이다.","Knowledge는 축적된 정보를 바탕으로 미래를 예측하고 창의적으로 판단하는 통찰이다.","Wisdom은 지식에 통찰과 윤리적 가치가 결합되어 도출된 창의적 판단 및 예지력이다."],"answer":4,"accepted_answers":null,"explanation":"순수 사실(Data) → 가공된 맥락(Information) → 규칙 및 패턴화(Knowledge) → 통찰력과 아이디어(Wisdom) 순서입니다.","correct_answer":4,"subject_name":"1과목 데이터의 이해"},{"id":"adsp-003","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터의 이해","question":"다음 중 빅데이터의 대표적인 특징으로 가트너(Gartner)가 제시한 '3V'에 해당하지 않는 것은?","code_snippet":null,"options":["규모 (Volume)","다양성 (Variety)","속도 (Velocity)","시각화 (Visualization)"],"answer":4,"accepted_answers":null,"explanation":"빅데이터 3V는 규모(Volume), 다양성(Variety), 속도(Velocity)입니다. 여기에 가치(Value), 정확성(Veracity) 등이 추가되어 4V/5V로 확장되기도 합니다.","correct_answer":4,"subject_name":"1과목 데이터의 이해"},{"id":"adsp-004","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터의 이해","question":"다음 중 데이터베이스의 일반적인 4가지 특성에 해당하지 않는 것은?","code_snippet":null,"options":["통합된 데이터 (Integrated Data)","저장된 데이터 (Stored Data)","운영 데이터 (Operational Data)","독립된 데이터 (Isolated Data)"],"answer":4,"accepted_answers":null,"explanation":"데이터베이스의 4대 특성은 통합된 데이터(Integrated), 저장된 데이터(Stored), 운영 데이터(Operational), 공용 데이터(Shared)입니다.","correct_answer":4,"subject_name":"1과목 데이터의 이해"},{"id":"adsp-005","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":1,"chapter":"1과목 데이터의 이해","question":"기업 내부 데이터베이스의 발전 과정 중, 고객과의 관계를 지속적으로 개선하여 고객 충성도를 높이기 위한 시스템은?","code_snippet":null,"options":["ERP (Enterprise Resource Planning)","CRM (Customer Relationship Management)","SCM (Supply Chain Management)","KMS (Knowledge Management System)"],"answer":2,"accepted_answers":null,"explanation":"CRM은 고객 관계 관리 시스템으로, 고객 정보를 통합 분석하여 마케팅과 서비스 질을 높이는 전략적 시스템입니다.","correct_answer":2,"subject_name":"1과목 데이터의 이해"},{"id":"adsp-006","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 데이터분석 기획","question":"빅데이터 분석 방법론 중 CRISP-DM 프로세스의 6단계에 포함되지 않는 것은?","code_snippet":null,"options":["업무 이해 (Business Understanding)","데이터 준비 (Data Preparation)","모델 구축 (Modeling)","분석 시스템 코딩 구현 (System Coding)"],"answer":4,"accepted_answers":null,"explanation":"CRISP-DM의 6단계는 업무이해 → 데이터이해 → 데이터준비 → 모델링 → 평가 → 전개(Deployment)입니다.","correct_answer":4,"subject_name":"2과목 데이터분석 기획"},{"id":"adsp-007","year":2020,"session":"2020년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 데이터분석 기획","question":"분석 과제 발굴 방식 중 '문제가 이미 명확하게 정의되어 있고, 하향식으로 해법을 찾아가는' 접근법은?","code_snippet":null,"options":["하향식 접근법 (Top-Down Approach)","상향식 접근법 (Bottom-Up Approach)","디자인 씽킹 (Design Thinking)","애자일 스크럼 (Agile Scrum)"],"answer":1,"accepted_answers":null,"explanation":"하향식 접근법은 문제가 명확할 때 문제 탐색 → 문제 정의 → 해결방안 도출 → 타당성 검토 순으로 진행됩니다.","correct_answer":1,"subject_name":"2과목 데이터분석 기획"},{"id":"adsp-008","year":2026,"session":"2026년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 데이터분석 기획","question":"상향식 접근법(Bottom-Up Approach)의 특징으로 가장 부적절한 것은?","code_snippet":null,"options":["문제 정의 자체가 어려운 발산(Divergence) 단계에 적합하다.","데이터를 먼저 관찰하고 탐색하여 새로운 인사이트를 도출한다.","비지도학습(Unsupervised Learning) 기법이 많이 활용된다.","기존의 가설을 신속하게 검증하는 데 가장 최적화되어 있다."],"answer":4,"accepted_answers":null,"explanation":"가설을 수립하고 검증하는 것은 하향식 접근법의 전형적인 방식입니다. 상향식은 가설 없이 데이터 자체의 관계를 탐색(Discovery)합니다.","correct_answer":4,"subject_name":"2과목 데이터분석 기획"},{"id":"adsp-009","year":2025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 데이터분석 기획","question":"분석 마스터 플랜 수립 시 우선순위 결정 기준 중 '시급성(Urgency)'과 '난이도(Difficulty)'를 축으로 할 때, 가장 먼저 추진해야 하는 사분면은?","code_snippet":null,"options":["시급성 높음, 난이도 낮음 (Quick-Win)","시급성 높음, 난이도 높음","시급성 낮음, 난이도 낮음","시급성 낮음, 난이도 높음"],"answer":1,"accepted_answers":null,"explanation":"시급성이 높고 난이도가 낮은 과제는 즉각적인 성과를 낼 수 있는 'Quick-Win' 영역으로 가장 최우선적으로 실행해야 합니다.","correct_answer":1,"subject_name":"2과목 데이터분석 기획"},{"id":"adsp-010","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":2,"chapter":"2과목 데이터분석 기획","question":"기업의 데이터 분석 거버넌스 조직 체계 중, 현업 부서마다 별도의 분석 인력을 배치하여 현업의 즉각적인 요구에 가장 민첩하게 대응할 수 있는 구조는?","code_snippet":null,"options":["집중 구조 (Centralized)","기능 구조 (Functional)","분산 구조 (Dispersed)","매트릭스 구조 (Matrix)"],"answer":2,"accepted_answers":null,"explanation":"기능 구조는 별도의 중앙 전담 분석 부서 없이 각 현업 부서 내에서 자체적으로 분석 업무를 수행하는 형태입니다.","correct_answer":2,"subject_name":"2과목 데이터분석 기획"},{"id":"adsp-011","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"주성분 분석(PCA, Principal Component Analysis)에 대한 설명으로 가장 옳지 않은 것은?","code_snippet":null,"options":["여러 독립변수 간 다중공선성이 존재할 때 차원을 축소하기 위해 유용하다.","첫 번째 주성분(PC1)은 전체 데이터의 분산을 가장 적게 설명하는 축으로 결정된다.","새롭게 생성된 주성분 변수들은 서로 상관관계가 없는 직교(Orthogonal) 관계이다.","변수의 스케일 차이에 영향을 받으므로 표준화 전처리가 필요하다."],"answer":2,"accepted_answers":null,"explanation":"제1주성분은 데이터의 전체 분산(정보량)을 가장 '크게(많이)' 설명할 수 있는 선형 결합 축입니다.","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-012","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"단순 선형 회귀분석에서 모델의 설명력을 나타내는 결정계수(R-squared)의 값의 범위로 올바른 것은?","code_snippet":null,"options":["-1 이상 1 이하","0 이상 1 이하","0 이상 무한대","-무한대 이상 무한대"],"answer":2,"accepted_answers":null,"explanation":"결정계수(R²)는 총변동 중 회귀선에 의해 설명되는 변동의 비율(SSR/SST)이므로 항상 0 이상 1 이하의 값을 갖습니다.","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-013","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"시계열 데이터가 통계적으로 안정된 정상성(Stationarity)을 만족하기 위한 조건으로 옳지 않은 것은?","code_snippet":null,"options":["평균이 시간에 무관하게 일정해야 한다.","분산이 시간에 무관하게 일정해야 한다.","공분산은 단지 시차(Lag)에만 의존하며 시점 자체에는 의존하지 않는다.","시간에 따라 계절성(Seasonality)과 추세(Trend)가 뚜렷하게 지속되어야 한다."],"answer":4,"accepted_answers":null,"explanation":"정상 시계열은 시간에 따른 추세나 계절성이 없어야 합니다. 추세가 있다면 차분(Differencing)을 통해 제거해야 정상성을 만족합니다.","correct_answer":4,"subject_name":"3과목 데이터분석"},{"id":"adsp-014","year":2020,"session":"2020년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"다음 군집 분석(Clustering) 기법 중, 사전에 군집 수 K를 정해두고 각 군집의 중심점(Centroid)을 반복적으로 갱신해나가는 비지도학습 알고리즘은?","code_snippet":null,"options":["K-평균 군집 (K-Means Clustering)","계층적 군집 (Hierarchical Clustering)","DBSCAN","자기조직화지도 (SOM)"],"answer":1,"accepted_answers":null,"explanation":"K-Means는 비계층적 군집 기법으로, 미리 K개의 중심점을 무작위로 선정한 뒤 최근접 객체들을 할당하고 중심점을 재계산하는 과정을 반복합니다.","correct_answer":1,"subject_name":"3과목 데이터분석"},{"id":"adsp-015","year":2026,"session":"2026년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"장바구니 분석(연관 분석)에서 품목 A와 B의 관계를 평가하는 지표 중, A를 구매했을 때 B도 함께 구매할 확률을 나타내는 조건부 확률 지표는?","code_snippet":null,"options":["지지도 (Support)","신뢰도 (Confidence)","향상도 (Lift)","카파 통계량 (Kappa)"],"answer":2,"accepted_answers":null,"explanation":"신뢰도(Confidence) = P(B|A) = P(A ∩ B) / P(A) 로, 품목 A가 포함된 거래 중 품목 B도 함께 포함된 거래의 비율을 의미합니다.","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-016","year":2025,"session":"2025년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"연관 분석의 향상도(Lift) 지표에서, 두 품목 A와 B가 서로 아무런 관련 없이 완전히 독립(Independent)인 경우 향상도의 값은?","code_snippet":null,"options":["0","1","100","음수"],"answer":2,"accepted_answers":null,"explanation":"향상도 Lift = P(A ∩ B) / [P(A) * P(B)] 입니다. A와 B가 독립이면 P(A ∩ B) = P(A)*P(B)이므로 향상도는 1이 됩니다. (1보다 크면 양의 상관관계)","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-017","year":2024,"session":"2024년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"로지스틱 회귀분석(Logistic Regression)에서 성공 확률 p를 실패 확률 (1-p)로 나눈 값을 무엇이라고 하는가?","code_snippet":null,"options":["오즈 (Odds, 승산)","오즈비 (Odds Ratio)","로그 우도 (Log-Likelihood)","잔차 (Residual)"],"answer":1,"accepted_answers":null,"explanation":"Odds = p / (1 - p) 이며, 로지스틱 회귀분석은 이 오즈에 자연로그를 취한 로짓(Logit) 함수를 선형 결합 형태로 모델링합니다.","correct_answer":1,"subject_name":"3과목 데이터분석"},{"id":"adsp-018","year":2023,"session":"2023년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"의사결정나무(Decision Tree)의 분할 기준 중 지니 지수(Gini Index) 또는 엔트로피(Entropy) 지수는 노드의 어떤 특성을 측정하는 지표인가?","code_snippet":null,"options":["정밀도 (Precision)","불순도 (Impurity)","상관도 (Correlation)","왜도 (Skewness)"],"answer":2,"accepted_answers":null,"explanation":"의사결정나무는 노드 내의 불순도(Impurity)가 낮아지는(순수도가 높아지는) 방향으로 최적의 분할 변수와 기준을 선택합니다.","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-019","year":2022,"session":"2022년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"분류 모형의 평가 지표 중, 실제 거짓(False)인 것 중에서 모델이 거짓으로 올바르게 예측한 비율을 의미하는 지표는?","code_snippet":null,"options":["민감도 (Sensitivity)","특이도 (Specificity)","재현율 (Recall)","정밀도 (Precision)"],"answer":2,"accepted_answers":null,"explanation":"실제 음성 중 참 음성으로 맞춘 비율(TN / [TN + FP])은 특이도(Specificity)입니다. 민감도(재현율)는 실제 양성 중 맞춘 비율(TP / [TP + FN])입니다.","correct_answer":2,"subject_name":"3과목 데이터분석"},{"id":"adsp-020","year":2021,"session":"2021년 기출복원","type":"multiple_choice","subject_id":3,"chapter":"3과목 데이터분석","question":"데이터 마이닝에서 표본 추출(Sampling) 기법 중, 모집단을 중복 없이 여러 층(Stratum)으로 나눈 뒤 각 층에서 무작위로 추출하는 기법은?","code_snippet":null,"options":["단순 무작위 추출 (Simple Random Sampling)","층화 추출 (Stratified Sampling)","군집 추출 (Cluster Sampling)","계통 추출 (Systematic Sampling)"],"answer":2,"accepted_answers":null,"explanation":"모집단의 특성(예: 성별, 연령대)을 반영하기 위해 모집단을 동질적인 여러 층으로 나눈 후 층별로 표본을 추출하는 방식은 층화 추출법입니다.","correct_answer":2,"subject_name":"3과목 데이터분석"}]`),Tt=JSON.parse(`[{"id":"wpc-written-001","year":2026,"session":"2026년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"GoF(Gang of Four) 디자인 패턴 중 생성(Creational) 패턴에 해당하지 않는 것은?","code_snippet":null,"options":["Abstract Factory","Builder","Adapter","Prototype"],"answer":3,"accepted_answers":null,"explanation":"Adapter 패턴은 클래스의 인터페이스를 사용자가 기대하는 다른 인터페이스로 변환하는 '구조(Structural) 패턴'입니다. 생성 패턴은 추상팩토리, 빌더, 팩토리메소드, 프로토타입, 싱글톤입니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-002","year":2025,"session":"2025년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"다음 파이썬(Python) 코드의 실행 결과로 올바른 것은?","code_snippet":"data = [10, 20, 30, 40, 50]\\nresult = [x * 2 for x in data if x > 25]\\nprint(len(result), result[0])","options":["3 60","2 50","3 50","2 60"],"answer":1,"accepted_answers":null,"explanation":"25보다 큰 원소 [30, 40, 50]에 대해 각 원소에 2를 곱하여 [60, 80, 100]이 됩니다. len(result)는 3이며, result[0]은 60입니다.","correct_answer":1,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-003","year":2024,"session":"2024년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"소프트웨어 테스트 기법 중 프로그램 내부 구조나 소스코드를 보지 않고, 요구사항 명세서를 기반으로 기능의 정상 동작 여부를 확인하는 테스트는?","code_snippet":null,"options":["화이트박스 테스트 (White Box Test)","블랙박스 테스트 (Black Box Test)","정적 테스트 (Static Test)","구조 기반 테스트 (Structural Test)"],"answer":2,"accepted_answers":null,"explanation":"명세 기반 테스트이자 내부 구조를 모르는 상태에서 입출력을 검증하는 테스트는 '블랙박스 테스트(Black Box Test)'입니다. 동등분할, 경계값분석 등이 대표적입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-004","year":2023,"session":"2023년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"관계형 데이터베이스에서 외래키(Foreign Key) 값은 참조하는 테이블의 기본키 값과 일치하거나 NULL이어야 한다는 규칙은?","code_snippet":null,"options":["개체 무결성 (Entity Integrity)","참조 무결성 (Referential Integrity)","도메인 무결성 (Domain Integrity)","키 무결성 (Key Integrity)"],"answer":2,"accepted_answers":null,"explanation":"릴레이션 간의 관계에서 외래키는 참조 릴레이션의 기본키 값을 참조하거나 NULL 값을 가져야 한다는 규칙은 '참조 무결성' 제약조건입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-005","year":2022,"session":"2022년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"비대칭키(공개키) 암호화 알고리즘에 해당하지 않는 것은?","code_snippet":null,"options":["RSA","ECC","AES","ElGamal"],"answer":3,"accepted_answers":null,"explanation":"AES는 대표적인 대칭키(비밀키) 블록 암호 알고리즘(128, 192, 256비트)입니다. RSA, ECC, ElGamal은 공개키(비대칭키) 알고리즘입니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-006","year":2021,"session":"2021년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"객체지향 설계 5대 원칙(SOLID) 중 '하위 클래스는 상위 클래스를 대체할 수 있어야 한다'는 원칙은?","code_snippet":null,"options":["단일 책임 원칙 (SRP)","개방 폐쇄 원칙 (OCP)","리스코프 치환 원칙 (LSP)","의존 역전 원칙 (DIP)"],"answer":3,"accepted_answers":null,"explanation":"LSP(Liskov Substitution Principle)는 자식 클래스는 최소한 부모 클래스가 할 수 있는 일은 수행할 수 있어야 한다는 대체 가능성의 원칙입니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-007","year":2020,"session":"2020년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"UML 다이어그램 중 시스템의 정적 구조를 표현하는 구조적(Structural) 다이어그램에 해당하는 것은?","code_snippet":null,"options":["시퀀스 다이어그램 (Sequence Diagram)","유스케이스 다이어그램 (Use Case Diagram)","클래스 다이어그램 (Class Diagram)","상태 다이어그램 (State Diagram)"],"answer":3,"accepted_answers":null,"explanation":"클래스 다이어그램은 객체 지향 모델의 정적 구조를 표현하는 대표적인 구조 다이어그램입니다. 시퀀스, 유스케이스, 상태 다이어그램은 행위(Behavioral) 다이어그램입니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-008","year":2026,"session":"2026년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"화이트박스 테스트 검증 기준(커버리지) 중 소스코드의 모든 분기(Branch)에서 참(True)과 거짓(False)이 적어도 한 번씩 수행되도록 보장하는 기준은?","code_snippet":null,"options":["구문 커버리지 (Statement Coverage)","결정 커버리지 (Decision / Branch Coverage)","조건 커버리지 (Condition Coverage)","다중 조건 커버리지 (Multiple Condition Coverage)"],"answer":2,"accepted_answers":null,"explanation":"결정(분기) 커버리지는 각 조건문 전체의 최종 결과가 참/거짓으로 적어도 한 번씩 실행되도록 하는 테스트 기준입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-009","year":2025,"session":"2025년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"소프트웨어 개발 생명주기(SDLC) 모형 중 위험 분석(Risk Analysis)을 병행하며 점진적으로 시스템을 개발해 나가는 모형은?","code_snippet":null,"options":["폭포수 모형 (Waterfall Model)","나선형 모형 (Spiral Model)","프로토타입 모형 (Prototyping Model)","애자일 모형 (Agile Model)"],"answer":2,"accepted_answers":null,"explanation":"나선형 모형은 계획수립 → 위험분석 → 개발및검증 → 고객평가의 4단계를 반복하며 대규모 시스템의 위험을 최소화하는 모델입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-010","year":2024,"session":"2024년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"트랜잭션의 4대 특성(ACID) 중 '트랜잭션이 성공적으로 완료되면 그 결과는 영구적으로 데이터베이스에 반영되어야 한다'는 원칙은?","code_snippet":null,"options":["원자성 (Atomicity)","일관성 (Consistency)","격리성 (Isolation)","지속성 (Durability)"],"answer":4,"accepted_answers":null,"explanation":"영구성/지속성(Durability)은 트랜잭션의 커밋이 성공하면 시스템 오류가 발생하더라도 그 상태가 영구히 보존되어야 한다는 특성입니다.","correct_answer":4,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-011","year":2023,"session":"2023년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"다음 C언어 프로그램의 출력 결과로 올바른 것은?","code_snippet":"#include <stdio.h>\\nint main() {\\n    int a = 5, b = 2;\\n    printf(\\"%d\\", a % b + a / b);\\n    return 0;\\n}","options":["1","2","3","4"],"answer":3,"accepted_answers":null,"explanation":"5 % 2의 나머지는 1이고, 5 / 2의 정수 몫은 2입니다. 따라서 1 + 2 = 3이 출력됩니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-012","year":2022,"session":"2022년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"다음 Java 코드에서 \`super\` 키워드의 주된 용도로 가장 올바른 것은?","code_snippet":"class Child extends Parent {\\n    Child() { super(); }\\n}","options":["현재 인스턴스 자신의 멤버를 참조","부모(상위) 클래스의 생성자 또는 멤버를 명시적으로 호출","인터페이스를 상속받기 위한 키워드","동기화(Synchronization) 블록을 선언"],"answer":2,"accepted_answers":null,"explanation":"\`super()\`는 자식 클래스에서 상위(부모) 클래스의 생성자나 메서드를 호출할 때 사용하는 참조 키워드입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-013","year":2021,"session":"2021년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"페이지 교체 알고리즘 중 가장 오랫동안 참조되지 않은 페이지를 교체 대상으로 선택하는 알고리즘은?","code_snippet":null,"options":["FIFO (First In First Out)","LRU (Least Recently Used)","LFU (Least Frequently Used)","OPT (Optimal)"],"answer":2,"accepted_answers":null,"explanation":"LRU는 최근에 가장 오랫동안 사용되지 않은 페이지를 교체하는 알고리즘입니다. LFU는 참조 횟수가 가장 적은 페이지를 교체합니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-014","year":2020,"session":"2020년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"IPv4 주소 체계에서 C 클래스(Class C)의 기본 서브넷 마스크(Default Subnet Mask)는?","code_snippet":null,"options":["255.0.0.0","255.255.0.0","255.255.255.0","255.255.255.255"],"answer":3,"accepted_answers":null,"explanation":"A클래스는 255.0.0.0, B클래스는 255.255.0.0, C클래스는 255.255.255.0 입니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-015","year":2026,"session":"2026년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"네트워크 프로토콜 중 IP 주소를 물리적 하드웨어 주소인 MAC 주소로 변환(해석)해주는 프로토콜은?","code_snippet":null,"options":["ARP (Address Resolution Protocol)","RARP (Reverse ARP)","DHCP","ICMP"],"answer":1,"accepted_answers":null,"explanation":"IP 주소 → MAC 주소 변환은 ARP입니다. 반대로 MAC 주소 → IP 주소 변환은 RARP입니다.","correct_answer":1,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-016","year":2025,"session":"2025년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"보안 공격 유형 중 공격자가 패킷의 출발지 IP 주소를 조작하여 신뢰받는 호스트인 것처럼 위장하는 기법은?","code_snippet":null,"options":["스니핑 (Sniffing)","스푸핑 (Spoofing)","스미싱 (Smishing)","피싱 (Phishing)"],"answer":2,"accepted_answers":null,"explanation":"스푸핑(Spoofing)은 '속이다'라는 뜻으로 IP, MAC, DNS 주소 등을 속여 시스템에 비인가 접근하는 기법입니다. 스니핑은 몰래 엿듣는 도청입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-017","year":2024,"session":"2024년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"접근 통제(Access Control) 모델 중 주체의 직무나 역할(Role)에 따라 시스템 자원에 대한 권한을 부여하는 모델은?","code_snippet":null,"options":["강제적 접근 통제 (MAC)","임의적 접근 통제 (DAC)","역할 기반 접근 통제 (RBAC)","규칙 기반 접근 통제 (RuBAC)"],"answer":3,"accepted_answers":null,"explanation":"RBAC(Role-Based Access Control)은 사용자의 역할과 조직 내 권한에 기반하여 자원 접근 권한을 할당하므로 대규모 기업 환경 관리에 유리합니다.","correct_answer":3,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-018","year":2023,"session":"2023년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"세션 하이재킹(Session Hijacking) 공격을 방지하기 위한 보안 대책으로 가장 적절한 것은?","code_snippet":null,"options":["세션 키를 URL 파라미터에 그대로 노출한다.","세션 만료 시간(Timeout)을 설정하고 HTTPS(SSL/TLS) 암호화 통신을 강제한다.","IP 인증을 비활성화한다.","비밀번호 변경 주기를 10년으로 연장한다."],"answer":2,"accepted_answers":null,"explanation":"HTTPS 암호화로 패킷 스니핑을 차단하고, 세션 유효시간을 짧게 설정하며 세션 ID를 주기적으로 재발급하는 것이 핵심 방어책입니다.","correct_answer":2,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-019","year":2022,"session":"2022년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"소프트웨어 형상 관리(SCM)의 주요 활동에 해당하지 않는 것은?","code_snippet":null,"options":["형상 식별 (Identification)","형상 통제 (Control)","형상 감사 (Audit)","하드웨어 조립 (Hardware Assembly)"],"answer":4,"accepted_answers":null,"explanation":"소프트웨어 형상 관리의 4대 활동은 식별, 통제, 감사(검증), 기록(상태 보고)입니다.","correct_answer":4,"subject_name":"소프트웨어 설계 및 응용"},{"id":"wpc-written-020","year":2021,"session":"2021년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"소프트웨어 설계 및 응용","question":"릴레이션에서 모든 결정자(Determinant)가 후보키(Candidate Key)여야 한다는 조건을 만족하는 정규형은?","code_snippet":null,"options":["제1정규형","제2정규형","제3정규형","보이스-코드 정규형 (BCNF)"],"answer":4,"accepted_answers":null,"explanation":"BCNF(Boyce-Codd Normal Form)는 3정규형을 만족하면서 모든 결정자가 후보키인 정규형으로, '강한 제3정규형'이라고도 합니다.","correct_answer":4,"subject_name":"소프트웨어 설계 및 응용"}]`),Et=JSON.parse(`[{"id":"com-study-001","year":2026,"session":"2026년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"중앙처리장치(CPU)와 주기억장치(RAM) 사이의 속도 차이를 줄여 컴퓨터의 처리 효율을 높이기 위해 사용되는 고속 메모리는?","code_snippet":null,"options":["캐시 메모리 (Cache Memory)","가상 메모리 (Virtual Memory)","플래시 메모리 (Flash Memory)","연관 메모리 (Associative Memory)"],"answer":1,"accepted_answers":null,"explanation":"CPU와 RAM 간의 병목현상을 완화하는 초고속 버퍼 메모리는 캐시 메모리(SRAM)입니다. 가상 메모리는 보조기억장치를 주기억장치처럼 활용하는 메모리 관리 기법입니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-002","year":2025,"session":"2025년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"다음 Excel 수식 중 =INDEX(A1:C5, 3, 2)를 실행했을 때 참조되는 셀의 위치로 가장 올바른 것은?","code_snippet":null,"options":["B3 셀","C2 셀","B2 셀","A3 셀"],"answer":1,"accepted_answers":null,"explanation":"INDEX(범위, 행, 열) 함수는 지정된 범위에서 행 번호와 열 번호가 교차하는 위치의 값을 반환합니다. A1:C5 범위에서 3행과 2열(B열)이 교차하므로 B3 셀입니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-003","year":2024,"session":"2024년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"OSI 7계층 참조 모델에서 종단 간(End-to-End)의 신뢰성 있고 투명한 데이터 전송을 제공하며 오류 제어, 흐름 제어를 담당하는 계층은?","code_snippet":null,"options":["물리 계층 (Physical Layer)","데이터 링크 계층 (Data Link Layer)","전송 계층 (Transport Layer)","네트워크 계층 (Network Layer)"],"answer":3,"accepted_answers":null,"explanation":"종단 간 연결을 제어하고 흐름 제어, 오류 복구, 포트 번호 다중화를 지원하는 TCP/UDP 프로토콜 계층은 '전송 계층(Transport Layer)'입니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-004","year":2023,"session":"2023년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"관계형 데이터베이스에서 두 테이블 간의 관계를 1:N으로 설정하려고 할 때, 'N' 쪽에 위치하는 외래키가 갖추어야 할 특징으로 가장 올바른 것은?","code_snippet":null,"options":["반드시 유일성(Unique)을 만족해야 한다.","기본키(Primary Key)와 반드시 같은 필드명이어야 한다.","기본키 테이블의 데이터 형식과 호환되어야 한다.","인덱스를 설정할 수 없다."],"answer":3,"accepted_answers":null,"explanation":"관계를 맺는 두 테이블의 기본키와 외래키는 필드명이 서로 달라도 무방하지만, 데이터 형식(Data Type)과 필드 크기는 반드시 호환되어야 합니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-005","year":2022,"session":"2022년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"다음 중 엑셀에서 절대 참조(Absolute Reference)를 지정하기 위해 사용하는 기호는?","code_snippet":null,"options":["%","$","#","&"],"answer":2,"accepted_answers":null,"explanation":"수식을 복사할 때 특정 셀의 행이나 열 위치가 변하지 않도록 고정하는 절대 참조 기호는 달러($) 기호입니다. (예: $A$1)","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-006","year":2021,"session":"2021년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"다음 중 그래픽 데이터의 표현 방식 중 비트맵(Bitmap, 래스터) 방식의 특징으로 가장 옳은 것은?","code_snippet":null,"options":["점과 선의 수학적 연산 공식으로 이미지를 표현한다.","이미지를 아무리 확대해도 테두리가 깨지지 않고 매끄럽다.","사진과 같이 풍부하고 정밀한 색상을 사실적으로 표현하기에 적합하다.","AI, WMF, SVG 포맷이 대표적인 비트맵 포맷이다."],"answer":3,"accepted_answers":null,"explanation":"비트맵은 픽셀(화소)의 집합으로 고해상도 사실적 사진 표현에 적합하지만, 확대 시 계단 현상(깨짐)이 발생합니다. 1, 2, 4번은 벡터(Vector)의 특징입니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-007","year":2020,"session":"2020년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"컴퓨터 바이러스 및 악성코드 중 사용자의 컴퓨터에 잠입하여 키보드 입력값을 몰래 가로채 아이디나 비밀번호를 탈취하는 프로그램은?","code_snippet":null,"options":["트로이 목마 (Trojan)","웜 (Worm)","키로거 (Keylogger)","랜섬웨어 (Ransomware)"],"answer":3,"accepted_answers":null,"explanation":"키로거(Keylogger)는 키보드로 입력되는 모든 타건 정보를 몰래 가로채 기록하고 전송하는 악성 스파이웨어 프로그램입니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-008","year":2026,"session":"2026년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel에서 수식 오류 메시지 중 유효하지 않은 셀 참조가 포함되어 있거나, 참조하던 행/열이 삭제되었을 때 나타나는 오류는?","code_snippet":null,"options":["#DIV/0!","#VALUE!","#REF!","#NAME?"],"answer":3,"accepted_answers":null,"explanation":"#REF! (Reference Error)는 참조하던 셀이나 영역이 삭제되거나 이동되어 참조 대상을 찾을 수 없을 때 발생하는 에러입니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-009","year":2025,"session":"2025년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel에서 =VLOOKUP(찾을값, 참조범위, 열번호, [찾을방법]) 함수 사용 시 정확하게 일치하는 값을 찾기 위해 '찾을방법'에 지정해야 하는 값은?","code_snippet":null,"options":["TRUE (또는 1)","FALSE (또는 0)","-1","생략"],"answer":2,"accepted_answers":null,"explanation":"정확히 일치하는 값을 검색할 때는 FALSE 또는 0을 지정해야 합니다. TRUE나 생략은 근사치(오름차순 정렬 전제)를 검색합니다.","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-010","year":2024,"session":"2024년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel에서 여러 셀의 조건을 동시에 만족하는 합계를 계산할 때 사용하는 함수는?","code_snippet":null,"options":["SUMIF","SUMIFS","COUNTIF","AVERAGEIF"],"answer":2,"accepted_answers":null,"explanation":"다중 조건(2개 이상의 조건)을 모두 만족하는 행들의 합계를 구할 때는 SUMIFS(합계범위, 조건범위1, 조건1, 조건범위2, 조건2...)를 사용합니다.","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-011","year":2023,"session":"2023년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel의 피벗 테이블(Pivot Table) 기능에 대한 설명으로 가장 옳지 않은 것은?","code_snippet":null,"options":["원본 데이터의 내용을 변경하면 피벗 테이블에 즉시 실시간으로 자동 반영된다.","대량의 원본 데이터를 손쉽게 요약하고 필드별 집계를 다각도로 분석할 수 있다.","행 레이블, 열 레이블, 값, 필터 영역으로 필드를 드래그하여 레이아웃을 구성한다.","피벗 테이블을 기반으로 피벗 차트를 생성할 수 있다."],"answer":1,"accepted_answers":null,"explanation":"피벗 테이블은 원본 데이터가 변경되어도 즉시 자동 반영되지 않으며, 반드시 [새로 고침(Refresh)] 버튼을 눌러야 업데이트됩니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-012","year":2022,"session":"2022년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel의 조건부 서식(Conditional Formatting)에 대한 설명으로 옳은 것은?","code_snippet":null,"options":["규칙에 만족하는 셀에만 서식을 지정할 수 있으며, 수식을 사용한 조건 설정은 불가능하다.","조건에 따라 셀의 배경색, 글꼴 색, 테두리 등을 자동으로 변경할 수 있다.","한 셀에는 오직 하나의 조건부 서식 규칙만 적용할 수 있다.","조건부 서식을 적용하면 원본 셀의 값 자체가 영구히 변경된다."],"answer":2,"accepted_answers":null,"explanation":"조건부 서식은 설정한 조건 만족 여부에 따라 스타일 서식만 동적으로 변경하며, 수식 조건 지정 및 다중 규칙 우선순위 적용이 가능합니다.","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-013","year":2021,"session":"2021년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Access에서 폼(Form)의 컨트롤(Control) 중 다른 테이블이나 쿼리의 필드와 직접 연결되어 데이터를 표시하거나 편집하는 컨트롤은?","code_snippet":null,"options":["바운드 컨트롤 (Bound Control)","언바운드 컨트롤 (Unbound Control)","계산 컨트롤 (Calculated Control)","라벨 컨트롤 (Label Control)"],"answer":1,"accepted_answers":null,"explanation":"테이블이나 쿼리의 레코드 원본과 결합되어 데이터를 실시간으로 주고받는 컨트롤을 '바운드 컨트롤'이라고 합니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-014","year":2020,"session":"2020년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Access에서 테이블 필드의 속성 중 반드시 값을 입력해야만 레코드가 저장되도록 강제하는 속성은?","code_snippet":null,"options":["기본값 (Default Value)","필수 (Required)","인덱스 (Indexed)","유효성 검사 규칙 (Validation Rule)"],"answer":2,"accepted_answers":null,"explanation":"'필수(Required)' 속성을 '예(Yes)'로 설정하면 해당 필드에 NULL 값이 입력되는 것을 차단하고 반드시 값을 입력하도록 강제합니다.","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-015","year":2026,"session":"2026년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Access에서 특정 조건을 만족하는 레코드의 개수를 구하기 위해 사용하는 도메인 집계 함수는?","code_snippet":null,"options":["DSum","DCount","DLookup","DAvg"],"answer":2,"accepted_answers":null,"explanation":"도메인 집계 함수 중 특정 테이블/쿼리에서 조건에 일치하는 레코드 수를 반환하는 함수는 DCount(\\"필드\\", \\"테이블\\", \\"조건\\") 입니다.","correct_answer":2,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-016","year":2025,"session":"2025년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"컴퓨터에서 사용하는 USB 3.0 포트의 표준 식별 색상으로 주로 채택되는 색상은?","code_snippet":null,"options":["흰색 (White)","검은색 (Black)","파란색 (Blue)","빨간색 (Red)"],"answer":3,"accepted_answers":null,"explanation":"USB 1.1은 흰색, USB 2.0은 검은색, 고속 전송(5Gbps)을 지원하는 USB 3.0은 파란색(Blue) 단자로 표준 시각화되어 있습니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-017","year":2024,"session":"2024년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"웹 브라우저가 웹 서버와 통신할 때 사용하는 기본 통신 포트 번호의 연결로 가장 올바른 것은?","code_snippet":null,"options":["HTTP : 80, HTTPS : 443","HTTP : 21, HTTPS : 22","HTTP : 25, HTTPS : 110","HTTP : 53, HTTPS : 8080"],"answer":1,"accepted_answers":null,"explanation":"표준 HTTP는 80번 포트를, SSL/TLS 암호화가 적용된 보안 HTTPS는 443번 포트를 기본으로 사용합니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-018","year":2023,"session":"2023년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Excel에서 \`=MOD(10, 3)\` 수식의 결과값으로 올바른 것은?","code_snippet":null,"options":["1","3","0","3.33"],"answer":1,"accepted_answers":null,"explanation":"MOD(숫자, 나눌수) 함수는 나눗셈의 나머지를 반환합니다. 10을 3으로 나눈 몫은 3이고 나머지는 1입니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-019","year":2022,"session":"2022년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"Access의 보고서(Report)에서 보고서의 맨 첫 페이지 상단에 단 한 번만 인쇄되는 구역은?","code_snippet":null,"options":["본문 (Detail)","페이지 머리글 (Page Header)","보고서 머리글 (Report Header)","그룹 머리글 (Group Header)"],"answer":3,"accepted_answers":null,"explanation":"보고서 머리글은 보고서의 첫 페이지 맨 위에 1회만 출력되며(제목, 로고 등), 페이지 머리글은 모든 페이지의 상단에 반복 인쇄됩니다.","correct_answer":3,"subject_name":"컴퓨터 일반 및 스프레드시트"},{"id":"com-study-020","year":2021,"session":"2021년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"컴퓨터 일반 및 스프레드시트","question":"인터넷에서 동적 호스트 구성 프로토콜로, 네트워크에 접속한 단말기에 IP 주소와 게이트웨이, DNS 주소를 자동으로 할당해주는 프로토콜은?","code_snippet":null,"options":["DHCP","DNS","FTP","SNMP"],"answer":1,"accepted_answers":null,"explanation":"DHCP(Dynamic Host Configuration Protocol)는 클라이언트 PC가 부팅될 때 IP 대역 풀에서 유효한 IP를 자동으로 대여해 주는 프로토콜입니다.","correct_answer":1,"subject_name":"컴퓨터 일반 및 스프레드시트"}]`),Dt=JSON.parse(`[{"id":"safety-001","year":2026,"session":"2026년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"하인리히(Heinrich)의 재해 구성 비율(도미노 연쇄이론)에서 '중상(사망) : 경상 : 무상해 아차사고'의 비율로 올바른 것은?","code_snippet":null,"options":["1 : 29 : 300","1 : 10 : 30 : 600","1 : 20 : 300","1 : 30 : 300"],"answer":1,"accepted_answers":null,"explanation":"하인리히 법칙은 1건의 중대재해가 발생하기 전에 29건의 경상해와 300건의 무상해 잠재적 위험(아차사고)이 존재한다는 1:29:300 법칙입니다. (버드의 법칙은 1:10:30:600)","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-002","year":2025,"session":"2025년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"시스템 안전 분석 기법 중 연역적(Deductive)이며 하향식(Top-down) 기법으로, 사고의 원인을 논리 게이트(AND, OR)를 사용하여 나뭇가지 형태로 전개하는 기법은?","code_snippet":null,"options":["FTA (Fault Tree Analysis)","FMEA (Failure Mode and Effects Analysis)","ETA (Event Tree Analysis)","HAZOP"],"answer":1,"accepted_answers":null,"explanation":"FTA는 정상사상(사고)에서 시작하여 논리기호로 원인을 하향식, 연역적으로 추적하는 결함수 분석법입니다. FMEA는 귀납적, 상향식(Bottom-up) 기법입니다.","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-003","year":2024,"session":"2024년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"산업안전보건법령상 산업용 로봇의 작동 범위 내에서 교시(Teaching) 작업을 할 때 작업 시작 전 점검해야 할 사항에 해당하지 않는 것은?","code_snippet":null,"options":["외부 전선의 피복 또는 외장의 손상 유무","매니퓰레이터 작동의 이상 유무","제동장치 및 비상정지장치의 기능","방호장치의 도색 상태"],"answer":4,"accepted_answers":null,"explanation":"산업용 로봇 교시 전 점검 항목은 1. 외부 전선 피복 손상 유무 2. 매니퓰레이터 작동 이상 유무 3. 제동장치 및 비상정지장치 기능입니다. 방호장치의 도색 상태는 법적 점검 사항이 아닙니다.","correct_answer":4,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-004","year":2023,"session":"2023년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"교류 아크 용접기의 자동전격방지기 설치 목적으로 가장 적절한 것은?","code_snippet":null,"options":["용접 아크의 안정성 유지","무부하 시 2차측 무부하 전압을 안전전압(25V 이하)으로 저하시켜 감전 재해 방지","과전류 유입 시 전원 자동 차단","전력 소모량 50% 절감"],"answer":2,"accepted_answers":null,"explanation":"자동전격방지기는 용접봉을 모재에서 떼었을 때(무부하 상태), 용접기 2차측 단자 전압을 안전전압(25V 이하)으로 낮추어 작업자의 감전 사고를 방지합니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-005","year":2022,"session":"2022년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"공기 중 가연성 가스의 폭발하한계가 4.0 vol%, 폭발상한계가 75.0 vol%일 때, 르 샤틀리에(Le Chatelier) 식에 기반한 폭발 위험도(Hazard Index, H)는?","code_snippet":null,"options":["16.75","17.75","18.75","19.75"],"answer":2,"accepted_answers":null,"explanation":"위험도 H = (폭발상한계 - 폭발하한계) / 폭발하한계 = (75 - 4) / 4 = 71 / 4 = 17.75 입니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-006","year":2021,"session":"2021년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"산업재해 발생의 직접적인 원인 중 '불안전한 행동(인적 요인)'에 해당하는 것은?","code_snippet":null,"options":["방호장치의 결함","작업자의 안전장구 미착용","복장의 불량","작업장 조명의 불량"],"answer":2,"accepted_answers":null,"explanation":"작업자가 개인보호구를 착용하지 않거나 위험지역에 무단 접근하는 것은 인적 '불안전한 행동'에 속합니다. 방호장치 결함이나 조명 불량은 물적 '불안전한 상태'입니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-007","year":2020,"session":"2020년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"버드(Frank Bird)의 신도미노 이론에서 재해 발생 과정의 5단계 중 제1단계에 해당하는 것은?","code_snippet":null,"options":["제어의 부족 (경영 관리)","기본 원인 (기원)","직접 원인 (징후)","사고 (접촉)"],"answer":1,"accepted_answers":null,"explanation":"버드의 5단계: 제어의 부족(경영/관리 결함) → 기본 원인 → 직접 원인(불안전한 상태·행동) → 사고 → 상해(손실).","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-008","year":2026,"session":"2026년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"사업장의 재해 빈도를 나타내는 '도수율(빈도율, Frequency Rate)'의 정의 공식으로 올바른 것은?","code_snippet":null,"options":["(연간 재해 건수 / 연간 총 근로시간수) * 1,000,000","(연간 근로손실일수 / 연간 총 근로시간수) * 1,000","(연간 재해자수 / 연평균 근로자수) * 1,000","(연간 사망자수 / 연평균 근로자수) * 10,000"],"answer":1,"accepted_answers":null,"explanation":"도수율(빈도율)은 연근로시간 100만 시간당 발생하는 재해 발생 건수를 나타냅니다. 강도율은 1,000시간당 근로손실일수입니다.","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-009","year":2025,"session":"2025년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"기계설비의 위험점(Danger Point) 6가지 중, 회전하는 두 회전체 사이에 손이나 작업복이 빨려 들어갈 위험이 형성되는 점은?","code_snippet":null,"options":["물림점 (Nip Point)","협착점 (Squeeze Point)","끼임점 (Shearing Point)","절단점 (Cutting Point)"],"answer":1,"accepted_answers":null,"explanation":"롤러, 기어 등 서로 반대 방향으로 맞물려 회전하는 두 축 사이에서 발생하는 위험점은 물림점(Nip Point)입니다.","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-010","year":2024,"session":"2024년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"프레스기 방호장치 중 슬라이드가 하강할 때 작업자의 손이 위험영역에 있으면 광선을 차단하여 슬라이드를 급정지시키는 광전자식 방호장치의 특징은?","code_snippet":null,"options":["분당 행정수가 120회 이상인 급정지식 프레스에 적합하다.","슬라이드 하사점에서만 작동한다.","연속 운전 시에만 사용이 가능하다.","기계식 클러치 프레스에 최적화되어 있다."],"answer":1,"accepted_answers":null,"explanation":"광전자식(감응식) 방호장치는 투광부와 수광부 사이에 손이 차단되면 급정지 기구가 즉시 작동해야 하므로 급정지 기구가 있는 프레스에만 적용할 수 있습니다.","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-011","year":2023,"session":"2023년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"인체에 전기가 흘렀을 때 스스로 전원으로부터 손을 뗄 수 있는 최대 전류 한계치를 무엇이라고 하는가?","code_snippet":null,"options":["감지 전류 (Perception Current)","이탈 전류 (또는 가수 전류, Let-go Current)","심실세동 전류 (Ventricular Fibrillation Current)","단락 전류 (Short-Circuit Current)"],"answer":2,"accepted_answers":null,"explanation":"성인 남성 기준 통상 약 10~15mA 수준으로 스스로 근육을 제어해 도체에서 이탈할 수 있는 한계 전류를 '이탈 전류(가수 전류)'라고 합니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-012","year":2022,"session":"2022년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"폭발성 가스나 증기가 존재하는 위험장소에서 점화원이 될 수 있는 전기설비에 대한 방폭구조 중 '기밀용기 내에 불활성가스를 압입하여 외부 가스 유입을 차단하는 구조'는?","code_snippet":null,"options":["내압 방폭구조 (d)","압력 방폭구조 (p)","유입 방폭구조 (o)","본질안전 방폭구조 (ia, ib)"],"answer":2,"accepted_answers":null,"explanation":"압력 방폭구조(Ex p)는 용기 내부에 신선한 공기나 질소 등 불활성가스를 양압으로 채워 가연성 가스가 내부로 스며들지 못하게 하는 구조입니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-013","year":2021,"session":"2021년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"물질안전보건자료(MSDS)에 기재되어야 하는 필수 16개 항목에 해당하지 않는 것은?","code_snippet":null,"options":["화학제품과 회사에 관한 정보","유해성·위험성 정보","응급조치 요령","해당 화학물질의 주식 시장 가격 및 거래처 목록"],"answer":4,"accepted_answers":null,"explanation":"MSDS는 화학물질의 안전한 취급을 위한 설명서로, 시장 가격이나 영업 비밀 거래처 정보는 기재 항목이 아닙니다.","correct_answer":4,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-014","year":2020,"session":"2020년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"분진폭발(Dust Explosion)이 발생하기 가장 쉬운 입자의 조건으로 올바른 것은?","code_snippet":null,"options":["입자의 직경이 매우 크고 무거울수록","입자의 표면적이 넓고 미세할수록","공기 중 수분 함유량이 90% 이상일 때","입자의 부유성이 낮아 바닥에 침강할 때"],"answer":2,"accepted_answers":null,"explanation":"분진폭발은 입자가 미세할수록 비표면적이 급격히 증가하여 화학 반응 속도와 점화 감도가 커지므로 폭발 위험성이 극대화됩니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-015","year":2026,"session":"2026년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"보일러의 과압 방지를 위해 설치하는 안전밸브(Safety Valve)의 작동 압력 검사 주기로 올바른 것은?","code_snippet":null,"options":["매주 1회 이상","매월 1회 이상","1년에 1회 이상","5년에 1회 이상"],"answer":3,"accepted_answers":null,"explanation":"안전보건규칙상 압력용기 및 보일러의 안전밸브는 원칙적으로 매 1년마다 1회 이상 공인 압력으로 토출 작동 검사를 수행해야 합니다.","correct_answer":3,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-016","year":2025,"session":"2025년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"지게차를 사용하여 작업을 할 때 작업 시작 전 점검해야 할 사항으로 옳지 않은 것은?","code_snippet":null,"options":["제동장치 및 조종장치 기능의 이상 유무","하역장치 및 유압장치 기능의 이상 유무","바퀴의 이상 유무","지게차 전조등의 색상 심미성"],"answer":4,"accepted_answers":null,"explanation":"지게차 작업시작 전 점검사항은 1. 제동 및 조종장치 2. 하역 및 유압장치 3. 바퀴 이상 4. 전조등·후미등·방향지시기 경보장치 기능 유무입니다.","correct_answer":4,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-017","year":2024,"session":"2024년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"안전모(안전보호구)의 사용 구분 중 '물체의 낙하, 비래 및 추락 방지뿐만 아니라 감전 방지(내전압성 7,000V 이하)'까지 겸용으로 방호하는 기호는?","code_snippet":null,"options":["A형","AB형","AE형","ABE형"],"answer":4,"accepted_answers":null,"explanation":"A(낙하·비래), B(추락), E(전기 감전 방지) 기능이 모두 포함된 최고 등급의 다목적 안전모는 ABE형입니다.","correct_answer":4,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-018","year":2023,"session":"2023년 제3회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"컨베이어(Conveyor) 벨트 작업 시 비상 상황이 발생했을 때 작업자가 즉시 가동을 멈출 수 있도록 설치해야 하는 필수 장치는?","code_snippet":null,"options":["비상정지장치 (Pull Code 스위치 등)","풋 스위치","과부하 경보벨","자동 도색기"],"answer":1,"accepted_answers":null,"explanation":"컨베이어 라인 전체를 따라 위험 시 어느 위치에서나 줄을 당겨 즉각 라인을 멈출 수 있는 비상정지장치(풀코드 스위치) 설치가 법적 의무입니다.","correct_answer":1,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-019","year":2022,"session":"2022년 제1회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"소화(Fire Extinguishing) 방법 중 연소물에 산소 공급을 차단하여 공기 중 산소 농도를 15% 이하로 낮추어 불을 끄는 방법은?","code_snippet":null,"options":["냉각 소화","질식 소화","제거 소화","억제(부촉매) 소화"],"answer":2,"accepted_answers":null,"explanation":"공기 중의 산소 유입을 모래, 이산화탄소, 폼 등으로 차단하여 산소 농도를 15% 이하로 떨어뜨려 진화하는 방법을 질식 소화라고 합니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"},{"id":"safety-020","year":2021,"session":"2021년 제2회 정기기출","type":"multiple_choice","subject_id":1,"chapter":"안전관리론 및 시스템안전공학","question":"안전관리 조직의 형태 중 생산 부서와 안전 부서가 완전히 분리되어, 안전 전담 참모(Staff)가 최고경영자를 보좌하며 전문적인 계획과 대책을 수립하는 조직 형태는?","code_snippet":null,"options":["직계식 조직 (Line 조직)","참모식 조직 (Staff 조직)","직계·참모식 조직 (Line-Staff 혼합형 조직)","프로젝트 조직"],"answer":2,"accepted_answers":null,"explanation":"참모식(Staff) 조직은 100~500명 규모의 중규모 사업장에 적합하며, 안전 전문가가 계획을 입안하고 조언하지만 현장에 대한 직접 지휘명령권은 없습니다.","correct_answer":2,"subject_name":"안전관리론 및 시스템안전공학"}]`),Ot={sqld:Ct,adsp:wt,eip_written:Tt,com1_written:Et,ind_safety_written:Dt,safety:Dt,eip_practical:JSON.parse('[{"id":"wpc-practical-001","year":2026,"session":"2026년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (C언어)","question":"다음 C언어 프로그램의 실행 결과를 쓰시오.","code_snippet":"#include <stdio.h>\\n\\nint main() {\\n    int arr[5] = { 10, 20, 30, 40, 50 };\\n    int *p = arr;\\n    int sum = 0;\\n    \\n    for(int i = 0; i < 3; i++) {\\n        sum += *(p + i * 2);\\n    }\\n    \\n    printf(\\"%d\\", sum);\\n    return 0;\\n}","options":null,"accepted_answers":["90"],"explanation":"포인터 p는 arr[0]의 주소입니다. i=0일 때 arr[0]=10, i=1일 때 arr[2]=30, i=2일 때 arr[4]=50이 누적되어 sum = 10 + 30 + 50 = 90이 됩니다.","correct_answer":"90","subject_name":"프로그래밍 언어 활용 (C언어)"},{"id":"wpc-practical-002","year":2025,"session":"2025년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (Java)","question":"다음 Java 프로그램의 실행 결과를 쓰시오.","code_snippet":"class SuperObject {\\n    public void paint() {\\n        draw();\\n    }\\n    public void draw() {\\n        System.out.print(\\"Super \\");\\n    }\\n}\\n\\nclass SubObject extends SuperObject {\\n    public void paint() {\\n        super.paint();\\n        draw();\\n    }\\n    public void draw() {\\n        System.out.print(\\"Sub \\");\\n    }\\n}\\n\\npublic class Test {\\n    public static void main(String[] args) {\\n        SuperObject obj = new SubObject();\\n        obj.paint();\\n    }\\n}","options":null,"accepted_answers":["Sub Sub","SubSub","Sub Sub"],"explanation":"SubObject 인스턴스에서 paint() 실행 시 super.paint()를 통해 부모의 paint()로 가지만, 동적 바인딩에 의해 오버라이딩된 SubObject의 draw()가 실행됩니다. 따라서 \\"Sub \\"가 두 번 출력됩니다.","correct_answer":"Sub Sub","subject_name":"프로그래밍 언어 활용 (Java)"},{"id":"wpc-practical-003","year":2024,"session":"2024년 기출복원","type":"subjective","subject_id":1,"chapter":"SQL 응용 (단답형)","question":"기존 STUDENT 테이블에 AGE 속성(INT 타입)을 추가하는 SQL DDL 명령문의 빈칸에 들어갈 키워드를 영문으로 작성하시오.\\n\\nALTER TABLE STUDENT [ ( 1 ) ] AGE INT;","code_snippet":null,"options":null,"accepted_answers":["ADD","add"],"explanation":"테이블에 열을 추가할 때의 표준 SQL DDL 문법은 ALTER TABLE 테이블명 ADD 컬럼명 데이터타입; 입니다.","correct_answer":"ADD","subject_name":"SQL 응용 (단답형)"},{"id":"wpc-practical-004","year":2023,"session":"2023년 기출복원","type":"subjective","subject_id":1,"chapter":"소프트웨어 공학 (단답형)","question":"모듈 내부가 아닌 모듈과 모듈 사이의 상호 의존 정도를 나타내는 척도로, 결합도가 (높을수록 / 낮을수록) 소프트웨어의 품질과 재사용성이 우수하다고 평가된다. 빈칸에 알맞은 단어를 작성하시오.","code_snippet":null,"options":null,"accepted_answers":["낮을수록","낮을 수록","낮아야"],"explanation":"소프트웨어 설계에서 모듈의 독립성을 높이려면 \'응집도(Cohesion)는 높이고, 결합도(Coupling)는 낮추어야\' 합니다.","correct_answer":"낮을수록","subject_name":"소프트웨어 공학 (단답형)"},{"id":"wpc-practical-005","year":2022,"session":"2022년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (Python)","question":"다음 Python 프로그램의 실행 결과를 쓰시오.","code_snippet":"def solve(text):\\n    return text[::-1]\\n\\nmsg = \\"PASS2026\\"\\nprint(solve(msg))","options":null,"accepted_answers":["6202SSAP"],"explanation":"문자열 슬라이싱 `text[::-1]`은 문자열을 뒤에서부터 역순으로 뒤집어 반환합니다. \\"PASS2026\\"을 뒤집으면 \\"6202SSAP\\"가 됩니다.","correct_answer":"6202SSAP","subject_name":"프로그래밍 언어 활용 (Python)"},{"id":"wpc-practical-006","year":2021,"session":"2021년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (C언어)","question":"다음 C언어 재귀함수(Recursive Function)의 실행 결과를 쓰시오.","code_snippet":"#include <stdio.h>\\n\\nint f(int n) {\\n    if (n <= 1) return 1;\\n    return n * f(n - 1);\\n}\\n\\nint main() {\\n    printf(\\"%d\\", f(4));\\n    return 0;\\n}","options":null,"accepted_answers":["24"],"explanation":"f(4) = 4 * f(3) = 4 * 3 * f(2) = 4 * 3 * 2 * f(1) = 4 * 3 * 2 * 1 = 24 입니다. 팩토리얼(Factorial) 연산입니다.","correct_answer":"24","subject_name":"프로그래밍 언어 활용 (C언어)"},{"id":"wpc-practical-007","year":2020,"session":"2020년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (Java)","question":"다음 Java 프로그램의 실행 결과를 쓰시오.","code_snippet":"public class ArrayTest {\\n    public static void main(String[] args) {\\n        int[] arr = { 2, 4, 6, 8, 10 };\\n        int sum = 0;\\n        for (int x : arr) {\\n            if (x > 5) sum += x;\\n        }\\n        System.out.print(sum);\\n    }\\n}","options":null,"accepted_answers":["24"],"explanation":"5보다 큰 원소는 6, 8, 10입니다. 따라서 sum = 6 + 8 + 10 = 24가 출력됩니다.","correct_answer":"24","subject_name":"프로그래밍 언어 활용 (Java)"},{"id":"wpc-practical-008","year":2026,"session":"2026년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (Python)","question":"다음 Python 딕셔너리 연산의 실행 결과를 쓰시오.","code_snippet":"scores = {\\"kor\\": 80, \\"eng\\": 90, \\"math\\": 70}\\nscores[\\"math\\"] = 85\\nscores[\\"sci\\"] = 95\\nprint(len(scores), scores[\\"math\\"])","options":null,"accepted_answers":["4 85","4","85"],"explanation":"초기 3개 키에서 \\"math\\"는 값이 85로 갱신되고, 새로운 키 \\"sci\\"가 추가되어 총 길이는 4가 됩니다. 출력은 \\"4 85\\"입니다.","correct_answer":"4 85","subject_name":"프로그래밍 언어 활용 (Python)"},{"id":"wpc-practical-009","year":2025,"session":"2025년 기출복원","type":"subjective","subject_id":1,"chapter":"데이터베이스 (SQL)","question":"다음 SQL 질의의 실행 결과 출력되는 숫자를 쓰시오.","code_snippet":"-- EMP 테이블에 총 5개의 행이 있고, \\n-- 그 중 2개 행의 COMM 컬럼 값이 NULL일 때\\nSELECT COUNT(COMM) FROM EMP;","options":null,"accepted_answers":["3"],"explanation":"`COUNT(*)`는 NULL을 포함한 전체 행 수(5)를 세지만, `COUNT(컬럼명)`은 컬럼 값이 NULL인 행을 제외하므로 5 - 2 = 3을 반환합니다.","correct_answer":"3","subject_name":"데이터베이스 (SQL)"},{"id":"wpc-practical-010","year":2024,"session":"2024년 기출복원","type":"subjective","subject_id":1,"chapter":"소프트웨어 공학 (디자인 패턴)","question":"객체의 생성과 관련된 디자인 패턴 중, 하나의 클래스에 대해 오직 단 하나의 인스턴스만 생성되도록 보장하고 이에 대한 전역적인 접근점을 제공하는 GoF 패턴의 명칭을 영문으로 쓰시오.","code_snippet":null,"options":null,"accepted_answers":["Singleton","singleton","싱글톤"],"explanation":"전역에서 유일한 하나의 인스턴스만 보장하는 대표적인 생성 패턴은 싱글톤(Singleton) 패턴입니다.","correct_answer":"Singleton","subject_name":"소프트웨어 공학 (디자인 패턴)"},{"id":"wpc-practical-011","year":2023,"session":"2023년 기출복원","type":"subjective","subject_id":1,"chapter":"네트워크 (프로토콜)","question":"IP 주소를 사용하여 목적지 호스트까지 패킷이 도달하는 최적의 경로를 설정해주는 3계층(네트워크 계층) 핵심 장비의 명칭을 쓰시오.","code_snippet":null,"options":null,"accepted_answers":["라우터","Router","router"],"explanation":"서로 다른 네트워크 대역을 연결하고 패킷의 최적 경로(Routing)를 지정하는 네트워크 3계층 장비는 라우터(Router)입니다.","correct_answer":"라우터","subject_name":"네트워크 (프로토콜)"},{"id":"wpc-practical-012","year":2022,"session":"2022년 기출복원","type":"subjective","subject_id":1,"chapter":"정보보안 (암호학)","question":"임의의 길이의 데이터를 입력받아 항상 고정된 길이의 고유한 문자열(다이제스트)을 출력하며, 복호화가 불가능한 일방향 암호화 알고리즘 군(SHA-256, MD5 등)을 무엇이라고 하는가?","code_snippet":null,"options":null,"accepted_answers":["해시 함수","해시함수","Hash","hash","해시"],"explanation":"역방향 계산(복호화)이 불가능하고 고정 길이 해시값을 생성하는 알고리즘은 해시 함수(Hash Function)입니다.","correct_answer":"해시 함수","subject_name":"정보보안 (암호학)"},{"id":"wpc-practical-013","year":2021,"session":"2021년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (C언어)","question":"다음 C언어 프로그램의 실행 결과를 쓰시오.","code_snippet":"#include <stdio.h>\\n\\nint main() {\\n    char str[] = \\"HELLO\\";\\n    printf(\\"%c%c\\", str[1], *(str + 4));\\n    return 0;\\n}","options":null,"accepted_answers":["EO","eo"],"explanation":"str[1]은 두 번째 문자인 \'E\'이며, *(str + 4)는 다섯 번째 문자인 \'O\'입니다. 따라서 연속으로 출력되어 \\"EO\\"가 됩니다.","correct_answer":"EO","subject_name":"프로그래밍 언어 활용 (C언어)"},{"id":"wpc-practical-014","year":2020,"session":"2020년 기출복원","type":"subjective","subject_id":1,"chapter":"데이터베이스 (SQL)","question":"테이블의 특정 컬럼에 값이 중복 입력되는 것을 방지하면서, 필요시 NULL 값은 허용하는 관계형 데이터베이스 무결성 제약조건 키워드를 영문으로 쓰시오.","code_snippet":null,"options":null,"accepted_answers":["UNIQUE","unique","유니크"],"explanation":"PRIMARY KEY는 NOT NULL + UNIQUE이지만, 중복을 불허하면서 NULL을 허용하는 제약조건은 UNIQUE 제약조건입니다.","correct_answer":"UNIQUE","subject_name":"데이터베이스 (SQL)"},{"id":"wpc-practical-015","year":2026,"session":"2026년 기출복원","type":"subjective","subject_id":1,"chapter":"프로그래밍 언어 활용 (Java)","question":"다음 Java 프로그램의 실행 결과를 쓰시오.","code_s
